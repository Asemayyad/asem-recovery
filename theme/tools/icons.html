<div class="grid" id="g"></div>
<script>
  const ids = ["install","wipe","backup","restore","mount","files","bolt","usb",
               "transfer","term","adv","power","reboot","moon","sun","gear",
               "globe","clock","palette","bright","vib","timer","info","back",
               "home","log","zip","img","up","check","chev","chevup",
               "phone","pc","bootl","lock","help","AB"];
  const g = document.getElementById("g");
  for (const id of ids) {
    const c = document.createElement("div"); c.className = "cell";
    if (id === "AB") { c.innerHTML = '<span class="ab">A/B</span>'; }
    else {
      const w = (id === "check" || id === "chev" || id === "chevup") ? 3 : 2;
      c.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"><use href="#${id}"/></svg>`;
    }
    g.appendChild(c);
  }
</script>
