name: Build ASEM Recovery (X6855)

on:
  workflow_dispatch:
    inputs:
      decrypt:
        description: "Build with decryption (R3, experimental)"
        type: boolean
        default: false
# Manual only (Actions tab > Run workflow): pushes never spend build minutes.

permissions:
  contents: read
  actions: write   # needed to delete older build artifacts

concurrency:
  group: asem-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Check out ASEM Recovery
        uses: actions/checkout@v7
        with:
          path: asem

      - name: Make room (pick the biggest disk, add swap)
        # No LVM tricks: an earlier run filled the system disk to 0 bytes that way and
        # the runner crashed without saving a log.
        run: |
          echo "== before"; df -h; free -h; nproc
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          for d in /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                   /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift \
                   /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules \
                   /usr/lib/jvm /usr/lib/google-cloud-sdk /opt/az /opt/microsoft /opt/google \
                   /opt/pipx /usr/share/miniconda /usr/local/aws-cli /usr/local/aws-sam-cli \
                   /usr/local/julia* /opt/mssql-tools; do
            sudo rm -rf $d &
          done
          sudo docker image prune -af >/dev/null 2>&1 &
          wait
          sudo apt-get clean
          root_free=$(df -m --output=avail / | tail -1)
          mnt_free=0
          if [ -d /mnt ] && [ "$(stat -c %d /mnt)" != "$(stat -c %d /)" ]; then
            mnt_free=$(df -m --output=avail /mnt | tail -1)
          fi
          echo "free: root ${root_free} MB, separate /mnt ${mnt_free} MB"
          if [ "$mnt_free" -gt "$root_free" ]; then
            build=/mnt/build; other=/; other_free=$root_free; build_free=$mnt_free
          else
            build=$HOME/build; other=/mnt; other_free=$mnt_free; build_free=$root_free
          fi
          sudo mkdir -p "$build"; sudo chown "$(id -u):$(id -g)" "$build"
          echo "BUILD_DIR=$build" >> "$GITHUB_ENV"
          # Memory: this runner has 7.8 GB RAM; Android 14's build analysis needs ~14+ GB.
          # 12 GB disk swap + compressed RAM swap (zram, if the kernel has it).
          if [ "$other_free" -gt 14000 ]; then swap=${other%/}/asem.swap; else swap=$build.swap; build_free=$((build_free - 12288)); fi
          sudo fallocate -l 12G "$swap" && sudo chmod 600 "$swap" && sudo mkswap "$swap" >/dev/null && sudo swapon -p 10 "$swap"
          if sudo modprobe zram 2>/dev/null && [ -e /sys/block/zram0 ]; then
            echo lz4 | sudo tee /sys/block/zram0/comp_algorithm >/dev/null 2>&1 || true
            echo 6G | sudo tee /sys/block/zram0/disksize >/dev/null && sudo mkswap /dev/zram0 >/dev/null && sudo swapon -p 100 /dev/zram0 && echo "zram: 6 GB"
          else
            echo "zram: not available on this kernel"
          fi
          sudo sysctl -q vm.swappiness=100 || true
          swapon --show
          echo "== after"; df -h; free -h; echo "build dir: $build (${build_free} MB usable)"
          if [ "$build_free" -lt 36000 ]; then
            echo "::error::Only ${build_free} MB free for the build (needs ~30 GB) - stopping now to save minutes."
            exit 1
          fi

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git git-lfs gnupg gperf lib32ncurses5-dev lib32z1-dev libelf-dev \
            liblz4-tool libncurses5 libssl-dev libxml2-utils lzop python3 rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev
          mkdir -p "$HOME/bin"
          curl -sSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "ASEM CI"
          git config --global user.email "ci@asem.local"
          git config --global color.ui false

      - name: Build
        shell: bash
        env:
          ASEM_DECRYPT: ${{ inputs.decrypt && 'true' || 'false' }}
        run: |
          cd asem
          # if memory runs out, let the kernel kill the build, not the GitHub runner
          for pid in $(pgrep -f 'Runner\.(Listener|Worker)'); do echo -1000 | sudo tee /proc/$pid/oom_score_adj >/dev/null; done
          log="$GITHUB_WORKSPACE/build.log"
          setsid bash build.sh "$BUILD_DIR/twrp" > "$log" 2>&1 &
          bpid=$!
          tail -n +1 -f --pid=$bpid "$log" &
          # disk watchdog: stop the build before a disk is completely full, so the
          # runner survives and the log gets uploaded
          n=0
          while kill -0 $bpid 2>/dev/null; do
            sleep 10; n=$((n + 1))
            b=$(df -m --output=avail "$BUILD_DIR" | tail -1); r=$(df -m --output=avail / | tail -1)
            if [ "$b" -lt 3000 ] || [ "$r" -lt 1500 ]; then
              echo "::error::Disk almost full (build dir ${b} MB, root ${r} MB) - stopping the build so the log is saved"
              df -h; kill -TERM -- -$bpid || true; sleep 15; kill -KILL -- -$bpid 2>/dev/null || true; break
            fi
            [ $((n % 30)) -eq 0 ] && echo "[watch] build dir ${b} MB free, root ${r} MB free, RAM avail $(free -m | awk '/Mem:/{print $7}') MB, swap used $(free -m | awk '/Swap:/{print $3}') MB"
          done
          wait $bpid; rc=$?
          sleep 2
          exit $rc

      - name: Upload recovery image
        if: always()   # also after a failed packing step: keeps the raw TWRP vendor_boot
        uses: actions/upload-artifact@v7
        with:
          name: ASEM_Recovery_X6855
          path: asem/out/*
          if-no-files-found: ignore
          retention-days: 5

      - name: Delete older build artifacts (keep storage free)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="https://api.github.com/repos/${{ github.repository }}"
          curl -s -H "Authorization: Bearer $GH_TOKEN" "$api/actions/artifacts?per_page=100" \
            | python3 -c "import json,sys; [print(a['id']) for a in json.load(sys.stdin)['artifacts'] if a['workflow_run']['id'] != ${{ github.run_id }}]" \
            | while read -r id; do
                curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" "$api/actions/artifacts/$id" && echo "deleted old artifact $id"
              done

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: |
            ${{ github.workspace }}/build.log
            ${{ env.BUILD_DIR }}/twrp/out/error.log
            ${{ env.BUILD_DIR }}/twrp/out/soong.log
          if-no-files-found: ignore
          retention-days: 5
